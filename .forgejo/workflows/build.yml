# Builds the site and its PDFs on every push and publishes them into /var/lib/rirekisho on ishizue,
# which Caddy serves on the tailnet (sekkeizu's modules/nixos/rirekisho.nix: the runner may write
# there and nowhere else).
#
# RIREKISHO_SITE is left unset until the résumé has a public address: the PDF's QR code would
# otherwise point recruiters to a tailnet name they can't reach.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: linux
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      # RIREKISHO_EMAIL and RIREKISHO_PHONE come from sops on ishizue (sekkeizu-private,
      # modules/rirekisho.nix), not from this public repository. Read line by line rather than
      # sourced, so a value with spaces needs no quotes; a missing file just leaves the lines out.
      - run: |
          nix develop --command sh -c '
            if [ -r /run/secrets/rirekisho-env ]; then
              while IFS="=" read -r key value; do
                case $key in RIREKISHO_*) export "$key=$value" ;; esac
              done < /run/secrets/rirekisho-env
            fi
            pnpm install --frozen-lockfile && pnpm build && pnpm pdf
          '
      - run: rsync -a --delete dist/ /var/lib/rirekisho/
      - uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: rirekisho
          path: dist/
